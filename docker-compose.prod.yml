version: '3.9'

services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: human_guard_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-human_guard_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthouse_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # REDIS CACHE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: human_guard_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthouse_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FASTAPI BACKEND
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: human_guard_backend_prod
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-human_guard_ai}
      POSTGRES_DB: ${POSTGRES_DB:-human_guard_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      
      # Security & Environment
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,https://yourdomain.com}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      
      # API Settings
      API_TITLE: ${API_TITLE:-Human Tech Smart Home Automation}
      API_VERSION: ${API_VERSION:-1.0.0}
      
      # MQTT (if used)
      MQTT_BROKER: ${MQTT_BROKER:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-user}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-password}
      
      # Firebase (if used)
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-firebase-credentials.json}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - backend_logs:/var/log/app
    
    expose:
      - "8000"
    
    networks:
      - smarthouse_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # REACT FRONTEND + NGINX
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: FRONTEND/Dockerfile
    container_name: human_guard_frontend_prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for HTTPS with SSL certificate
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_logs:/var/log/nginx
      # - ./docker/ssl:/etc/nginx/ssl:ro  # Uncomment for HTTPS
    
    depends_on:
      - backend
    
    networks:
      - smarthouse_network
    
    healthcheck:
      test: ["CMD", "ash", "-c", "wget -q -O- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # MQTT BROKER (Optional - for IoT device communication)
  # ============================================================
  # mqtt:
  #   image: eclipse-mosquitto:latest
  #   container_name: human_guard_mqtt_prod
  #   restart: unless-stopped
  #   ports:
  #     - "1883:1883"
  #     - "9001:9001"
  #   volumes:
  #     - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  #     - mqtt_data:/mosquitto/data
  #   networks:
  #     - smarthouse_network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

# ============================================================
# NETWORKS
# ============================================================
networks:
  smarthouse_network:
    driver: bridge

# ============================================================
# VOLUMES (Persistent Data)
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  frontend_logs:
    driver: local
  # mqtt_data:
  #   driver: local
